# ===================================================================
# Enterprise Field Visit & CRM System - Spring Boot Configuration
# ===================================================================

# Application Server Port
server.port=${SERVER_PORT:4000}

# Microsoft SQL Server Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://${DB_HOST:127.0.0.1}:${DB_PORT:1434};databaseName=${DB_NAME:field_visit};encrypt=true;trustServerCertificate=true;integratedSecurity=true;}
spring.datasource.username=${DB_USER:}
# Database Driver (Auto-detects MSSQL or PostgreSQL from JDBC URL)
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:1}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.hbm2ddl.auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT Security
jwt.secret=${JWT_SECRET:EnterpriseFieldVisitCRMSecureProductionKey2026EnterpriseFieldVisitCRMSecretKey2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAPI / Swagger Documentation Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Microsoft Entra ID / Azure Active Directory Configuration
azure.activedirectory.client-id=${AZURE_CLIENT_ID:63af8748-b960-4f66-9ef7-e6be3b13e0d1}
azure.activedirectory.tenant-id=${AZURE_TENANT_ID:5adb2e4c-71ad-431a-81fa-d48da6fe6b40}

# File Upload Limits (Receipts, Visit Reports, PDFs)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Email & SMTP Alert Configuration
# Set app.email.enabled=true and provide SMTP credentials (e.g. Gmail App Password, Office365, SendGrid) to deliver live emails
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:notifications@crm.com}
app.email.admin=${ADMIN_EMAIL:admin@crm.com}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

