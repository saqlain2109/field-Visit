services:
  - type: web
    name: field-visit-backend
    runtime: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldvisit-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: fieldvisit-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: fieldvisit-db
          property: password
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SERVER_PORT
        value: "4000"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: HIKARI_MAX_POOL
        value: "4"
      - key: HIKARI_MIN_IDLE
        value: "1"

databases:
  - name: fieldvisit-db
    databaseName: field_visit
    user: fieldvisit_user
    plan: free
    region: singapore
