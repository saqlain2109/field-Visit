apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: field-crm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-db-and-init
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: DB_NAME
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for SQL Server service to be ready..."
              until /opt/mssql-tools18/bin/sqlcmd -S sqlserver-svc -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; do
                echo "SQL Server not ready yet. Sleeping 3 seconds..."
                sleep 3
              done
              echo "Creating database if not exists..."
              /opt/mssql-tools18/bin/sqlcmd -S sqlserver-svc -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'$DB_NAME') CREATE DATABASE [$DB_NAME];"
              echo "Database initialization completed successfully!"
      containers:
        - name: backend
          image: field-crm-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: crm-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: field-crm
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
