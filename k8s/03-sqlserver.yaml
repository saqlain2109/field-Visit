apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: field-crm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: DB_PASSWORD
            - name: MSSQL_PID
              value: "Developer"
          ports:
            - containerPort: 1433
          volumeMounts:
            - name: mssql-storage
              mountPath: /var/opt/mssql
          resources:
            requests:
              memory: "1500Mi"
              cpu: "500m"
            limits:
              memory: "3000Mi"
              cpu: "2000m"
          readinessProbe:
            exec:
              command:
                - /opt/mssql-tools18/bin/sqlcmd
                - -S
                - localhost
                - -U
                - sa
                - -P
                - "$(MSSQL_SA_PASSWORD)"
                - -C
                - -Q
                - "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: mssql-storage
          persistentVolumeClaim:
            claimName: mssql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-svc
  namespace: field-crm
spec:
  selector:
    app: sqlserver
  ports:
    - name: sql
      port: 1433
      targetPort: 1433
